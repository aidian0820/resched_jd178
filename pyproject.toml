[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aidian0820-resched_jd178"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告训练资源调度工程师·合成数据的质量分水岭相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "aidian0820" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://aidian0820.github.io"
Repository = "https://github.com/aidian0820/resched_jd178"
Issues = "https://github.com/aidian0820/resched_jd178/issues"

[project.scripts]
resched_jd178 = "resched_jd178:main"

[tool.setuptools]
py-modules = ["resched_jd178"]
